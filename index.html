:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%} [hidden]{display:none!important}
:root{
  --bg:#EEF2F2; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#15232A; --muted:#58686F; --line:#D5DEDF;
  --accent:#00747E; --accent-ink:#FFFFFF; --accent-soft:#DCEFF0;
  --u1:#0066AE; --u2:#00858F; --u3:#F2C300; --u3-ink:#2A2300;
  --ok:#1E7F46; --ok-soft:#E1F3E7; --bad:#B8322B; --bad-soft:#FBE6E3; --due:#B7791F; --due-soft:#FBF0DC;
  --der:#2356C9; --die:#C62D42; --das:#1E8A4F;
  --shadow:0 1px 2px rgba(15,35,42,.06),0 4px 16px rgba(15,35,42,.06);
  --r:14px; --r-sm:10px;
  --f-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1619; --surface:#16222A; --surface-2:#1B2931; --ink:#E4ECEE; --muted:#93A5AB; --line:#2A3A42;
  --accent:#3CB9C4; --accent-ink:#06282C; --accent-soft:#163A40;
  --u1:#4A9BE0; --u2:#3CB9C4; --u3:#F2C300;

  --der:#7FA6FF; --die:#FF7D8F; --das:#6ED49A; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1619; --surface:#16222A; --surface-2:#1B2931; --ink:#E4ECEE; --muted:#93A5AB; --line:#2A3A42;
  --accent:#3CB9C4; --accent-ink:#06282C; --accent-soft:#163A40;
  --u1:#4A9BE0; --u2:#3CB9C4; --u3:#F2C300;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

L({ id: "a21-01", s: "A2.1", t: "Hatıralar ve Präteritum", en: "Memories and the simple past",

          "Speech uses the Perfekt; the Präteritum is typical of written narration — except sein, haben, modals, es gab, wissen, denken."],
    ["rule", "Düzenli fiiller: kök + -te + ek. ich ve er/sie/es aynıdır: ich machte, er machte; du machtest; wir machten. Kök -t/-d ile bitiyorsa -ete: arbeitete. Düzensiz fiillerde kök değişir, -te yoktur: ich ging, er kam.",
             "Regular: stem + -te (ich = er). Irregular: stem vowel changes, no -te."],

L({ id: "s-02", s: "Durum", t: "Telefonla bilgi, kurs kaydı ve banka", en: "Phone enquiries, course enrolment, bank",

  th: [

      ["Özgür", "Guten Tag, ich möchte mich für einen Deutschkurs anmelden. Können Sie mir sagen, ob es noch Plätze im A2-Kurs gibt?", "İyi günler, bir Almanca kursuna kaydolmak istiyorum. A2 kursunda hâlâ yer var mı söyleyebilir misiniz?", "Are there still places in the A2 course?"],

      ["Özgür", "Wie viel kostet der Kurs, und wann beginnt er?", "Kurs ne kadar ve ne zaman başlıyor?", "How much is it and when does it start?"],
      ["VHS", "Er kostet 240 Euro und beginnt am 3. November. Sie können vorher einen Einstufungstest machen.", "240 euro ve 3 Kasım'da başlıyor. Önceden seviye testi yapabilirsiniz.", "240 euros, starts 3 November; you can take a placement test."],

      ["VHS", "Ja, auf unserer Webseite. Die Zahlung erfolgt per Lastschrift.", "Evet, sitemizden. Ödeme otomatik tahsilatla.", "Yes, on our website; payment by direct debit."]

function dueMistakes() { const now = Date.now(); return Object.entries(S.mistakes).filter(([, m]) => m.due <= now).sort((a, b) => a[1].due - b[1].due).map(([k]) => k); }

/* ---------- sessions ---------- */
function startLesson(id) {
  const l = LESSONS[LIDX[id]]; if (!l) return;
  S.session = { mode: "lesson", id, title: `Ders ${l.n} · ${l.t}`, phase: "theory", keys: lessonKeys(l), i: 0, res: [], seed: (Date.now() % 100000) };
  fb = null; ordPicked = []; save(); go("play");
}
function startReview(keys, title = "Hatalarım · tekrar") {

  S.session = { mode: "review", id: "review", title, phase: "ex", keys: keys.slice(0, 20), i: 0, res: [], seed: (Date.now() % 100000) };
  fb = null; ordPicked = []; save(); go("play");
}
function poolFor(from, to, seed) {
  const keys = [];
  for (let i = from; i <= to; i++) { const l = LESSONS[i]; if (!l) continue; l.x.forEach((x, j) => keys.push(l.id + "#" + j)); const v = l.v || []; if (v.length) keys.push(`v#${l.id}#${hash(l.id + seed) % v.length}#m`); }

}
function startQuiz(qid) {
  const q = QIDX[qid]; const seed = Date.now() % 1000003;
  let keys, sections = null;
  if (q && q.mock) {
    const ls = [], gram = [], wr = [];
    LESSONS.forEach(l => l.x.forEach((x, j) => { const k = l.id + "#" + j; if (x[0] === "ls") ls.push(k); else if (x[0] === "mc" || x[0] === "fill") gram.push(k); else if (x[0] === "tr") wr.push(k); }));

    const R = []; READING.forEach(r => r.qs.forEach((_, i) => R.push(`r#${r.id}#${i}`)));
    const F = (typeof FORMTASK !== "undefined" && FORMTASK) ? FORMTASK.fields.map((_, i) => "f#" + i) : [];
    const W = shuffle(wr, seed + 1).slice(0, F.length ? 4 : 6);
    const G = shuffle(gram, seed + 2).slice(0, 12);
    keys = H.concat(R, F, W, G);
    sections = [["Hören", 0, H.length], ["Lesen", H.length, H.length + R.length], ["Schreiben", H.length + R.length, H.length + R.length + F.length + W.length], ["Grammatik", H.length + R.length + F.length + W.length, keys.length]];
  } else if (qid === "mix") {
    const done = LESSONS.map((l, i) => i).filter(i => lessonDone(i));
    const idx = done.length ? done : [0, 1, 2];
    const pool = []; idx.forEach(i => pool.push(...poolFor(i, i, seed)));
    keys = shuffle(pool, seed).slice(0, 10);
  } else {
    keys = shuffle(poolFor(q.from, q.to, seed), seed).slice(0, q.n);

  fb = null; ordPicked = []; save(); go("play");
}
function finishSession() {
  const s = S.session; if (!s) return;
  const ok = s.res.filter(r => r.ok).length, n = s.res.length, p = pct(ok, n);
  if (s.mode === "lesson") {
    const L = S.lessons[s.id] || { attempts: 0, best: 0 };
    L.done = true; L.last = p; L.best = Math.max(L.best || 0, p); L.attempts = (L.attempts || 0) + 1; L.at = Date.now();
    S.lessons[s.id] = L;
  } else if (s.mode === "quiz") {
    const Q = S.quizzes[s.id] || { attempts: 0, best: 0, hist: [] };
    Q.last = p; Q.best = Math.max(Q.best || 0, p); Q.attempts = (Q.attempts || 0) + 1; Q.hist = (Q.hist || []).concat([[Date.now(), p]]).slice(-10);
    S.quizzes[s.id] = Q;

  }
  return `<div class="q">${head}${passage}${prompt}</div>${area}${actions}${fbHTML}`;
}
function renderResults() {
  const s = S.session;
  const ok = s.res.filter(r => r.ok).length, n = s.res.length, p = pct(ok, n);
  const wrong = s.res.filter(r => !r.ok);
  const passLine = s.mode === "quiz" ? (p >= (s.id === "mock" ? 60 : PASS) ? `<span class="pill ok">Geçtin</span>` : `<span class="pill bad">Geçme sınırı %${s.id === "mock" ? 60 : PASS}</span>`) : "";
  let secHTML = "";
  if (s.sections) {
    secHTML = `<div class="sec-scores" style="margin-top:14px">${s.sections.map(sec => { const part = s.res.slice(sec[1], sec[2]); const k = part.filter(r => r.ok).length; return `<div class="kpi"><div class="n">%${pct(k, part.length)}</div><div class="l">${sec[0]} · ${k}/${part.length}</div></div>`; }).join("")}</div>`;
  }
  const l = s.mode === "lesson" ? LESSONS[LIDX[s.id]] : null;
  const next = l ? LESSONS[l.n] : null;
  const nq = l ? QUIZZES.find(q => q.after === LIDX[l.id]) : null;
  return `<div class="lesson-h"><span class="eyebrow">${s.mode === "lesson" ? "Ders tamamlandı" : s.mode === "quiz" ? "Sınav sonucu" : "Tekrar tamamlandı"}</span><h1>${esc(s.title)}</h1></div>
  <div class="card"><div class="score"><div class="ring" style="--p:${p};--c:${p >= PASS ? "var(--ok)" : p >= 50 ? "var(--due)" : "var(--bad)"}"><span>%${p}</span></div>
    <div class="stack" style="gap:6px"><div style="font-size:18px;font-weight:700">${ok} doğru, ${n - ok} yanlış</div><div class="row">${passLine}${s.mode === "lesson" ? `<span class="stars">${stars(p)}</span>` : ""}</div>
    <div class="muted">${wrong.length ? "Yanlışların Tekrar listesine eklendi. Aralıklı tekrarla 1, 3 ve 7 gün sonra tekrar sorulur; üst üste doğru bildiğinde listeden çıkar." : "Hiç yanlış yok. Böyle devam!"}</div></div></div>
    ${secHTML}
    <div class="row" style="margin-top:16px">
      ${wrong.length ? `<button class="btn primary" data-retry>Yanlışları şimdi tekrar et (${Math.min(wrong.length, 20)})</button>` : ""}
      ${nq && !quizPassed(nq) ? `<button class="btn ${wrong.length ? "" : "primary"}" data-quiz="${nq.id}">${esc(nq.t)}</button>` : ""}
      ${next ? `<button class="btn ${wrong.length || (nq && !quizPassed(nq)) ? "" : "primary"}" data-lesson="${next.id}">Sonraki ders: ${esc(next.t)}</button>` : ""}
      <button class="btn ghost" data-home>Yola dön</button>
    </div></div>
  ${wrong.length ? `<div class="sec-title"><h2>Yanlışların</h2></div><div class="mlist">${wrong.map(r => mistakeCard(r.k, r.g, null)).join("")}</div>` : ""}`;
}
function mistakeCard(k, given, m) {
  const ex = exFromKey(k); if (!ex) return "";
  const due = m ? (m.due <= Date.now() ? `<span class="pill due">tekrar zamanı</span>` : `<span class="pill">${Math.max(1, Math.ceil((m.due - Date.now()) / DAY))} gün sonra</span>`) : "";
  const lvl = m ? `<span class="pill acc">seviye ${m.box}/${INTERVALS.length}</span>` : "";
  return `<div class="mitem">${ex.passage ? `<div class="src">${esc(ex.passageTitle || "")}</div>` : ""}<div class="p">${esc(ex.type === "ls" ? `Dinleme: „${ex.hear}“ — ${ex.prompt}` : ex.prompt)}</div>
    ${given ? `<div class="yours">Senin cevabın: <s>${esc(given)}</s></div>` : `<div class="yours">Cevap verilmedi</div>`}
    <div class="corr">Doğrusu: ${esc(correctText(ex))}</div>${ex.expl ? `<div class="why">${esc(ex.expl)}</div>` : ""}
    ${m ? `<div class="foot">${due}${lvl}<span class="pill">${m.n}× yanlış</span><span class="src">${esc(ex.src || "")}</span><button class="btn sm ghost" data-forget="${esc(k)}" style="margin-left:auto">Öğrendim, listeden çıkar</button></div>` : ""}</div>`;
}

/* answer handling */
function submit(given) {
  const s = S.session, ex = curEx(); if (!ex || fb) return;
  const r = check(ex, given);
  const ctx = s.mode === "review" ? "review" : s.mode === "quiz" ? "quiz" : "learn";
  record(ex.key, r.ok, given, ctx);
  s.res[s.i] = { k: ex.key, ok: r.ok, g: given };
  if (s.mode === "quiz") { advance(); return; }
  fb = { ok: r.ok, given, note: r.note };
  s.fb = fb;
  save(); render();
  setTimeout(() => { const b = $("[data-next]"); if (b) b.focus(); }, 30);
}
function advance() {
  const s = S.session;
  fb = null; s.fb = null; ordPicked = [];
  s.i++;
  if (s.i >= s.keys.length) finishSession(); else save();
  render(); window.scrollTo(0, 0);
  autoplayListen();
}
function autoplayListen() {
  const s = S.session; if (!s || s.phase !== "ex") return;
  const ex = curEx(); if (ex && ex.type === "ls" && !fb) setTimeout(() => { const b = $(".listen .big"); if (b) speak(ex.hear, b); }, 250);
}
function currentTyped() {
  const ex = curEx();
  if (ex.type === "ord") { const toks = shuffle(ex.ans[0].split(" "), hash(ex.key) + S.session.seed); return ordPicked.map(i => toks[i]).join(" "); }
  const inp = $("[data-ans]"); return inp ? inp.value : "";
}
function afterPlayer() {
  const s = S.session;
  if (s && s.fb && !fb) fb = s.fb;
  const inp = $("[data-ans]"); if (inp && !fb) setTimeout(() => inp.focus(), 30);
}

/* ---------- WORDS ---------- */
let fcState = null; // {queue:[wordKey], i, flip}
let dictQ = "";
function viewWords() {
  if (fcState && fcState.i < fcState.queue.length) return viewFlash();
  const due = dueWords();
  const decks = LESSONS.filter(l => (l.v || []).length).map(l => {
    const ws = ALL_WORDS.filter(w => w.lid === l.id); const seen = ws.filter(w => S.vocab[w.key]).length; const known = ws.filter(w => S.vocab[w.key] && S.vocab[w.key].box >= 3).length;
    return `<button class="deck" data-deck="${l.id}"><span class="eyebrow">${esc(l.s)} · Ders ${l.n}</span><b>${esc(l.t)}</b><span class="muted" style="font-size:13px">${ws.length} kelime · ${seen} görüldü · ${known} öğrenildi</span><div class="bar"><i style="width:${pct(known, ws.length)}%"></i></div></button>`;
  }).join("");

  <div class="row">${due.length ? `<button class="btn primary" data-fc-due>Tekrar et</button>` : ""}<button class="btn" data-fc-new>Yeni kelimeler (10)</button></div></div></div>
  <div class="sec-title"><h2>Ders desteleri</h2></div><div class="decks">${decks}</div>
  <div class="sec-title"><h2>Sözlük</h2><span class="muted" style="font-size:13px">${ALL_WORDS.length} kelime</span></div>
  <div class="search">${IC.search}<input class="inp" id="dict-q" data-dict placeholder="Almanca, Türkçe veya İngilizce ara…" value="${esc(dictQ)}" aria-label="Sözlükte ara"></div>
  <div class="dict" id="dict" style="margin-top:8px">${dictRows()}</div>`;
}
function dictRows() {
  const q = norm(dictQ);
  let rows = ALL_WORDS;
  if (q) rows = rows.filter(w => norm(w.de).includes(q) || norm(w.tr).includes(q) || norm(w.en).includes(q));
  const seen = new Set(); rows = rows.filter(w => { const k = w.de + "|" + w.tr; if (seen.has(k)) return false; seen.add(k); return true; });
  const cut = rows.slice(0, q ? 200 : 60);
  return cut.map(w => `<div><span>${artHTML(w.de)}</span><span>${esc(w.tr)}</span><span class="en muted">${esc(w.en)}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="l">D${LESSONS[LIDX[w.lid]].n}</span>${sayBtn(w.de.split(",")[0])}</span></div>`).join("") +
    (rows.length > cut.length ? `<div class="muted" style="grid-template-columns:1fr">+${rows.length - cut.length} kelime daha · aramayla daralt</div>` : "") + (!rows.length ? `<div class="muted" style="grid-template-columns:1fr">Sonuç yok</div>` : "");
}
function startFlash(keys) { if (!keys.length) { toast("Bu destede gösterilecek kart kalmadı."); return; } fcState = { queue: keys, i: 0, flip: false, known: 0 }; render(); }
function viewFlash() {
  const k = fcState.queue[fcState.i]; const w = ALL_WORDS.find(x => x.key === k);
  const rec = S.vocab[k];
  return `<div class="page-h row" style="justify-content:space-between"><div><h1>Kelime kartları</h1><p>${fcState.i + 1} / ${fcState.queue.length} · ${rec ? `seviye ${rec.box}` : "yeni kart"}</p></div><button class="btn ghost sm" data-fc-end>Bitir</button></div>
  <div class="bar"><i style="width:${pct(fcState.i, fcState.queue.length)}%"></i></div>
  <div class="flash"><div class="fcard ${fcState.flip ? "flip" : ""}" data-flip role="button" tabindex="0" aria-label="Kartı çevir">
    <div class="face"><span class="eyebrow">Ders ${LESSONS[LIDX[w.lid]].n}</span><div class="w">${artHTML(w.de)}</div>${sayBtn(w.de.split(",")[0])}<span class="hint">Çevirmek için dokun · boşluk</span></div>
    <div class="face back"><div class="w" style="font-size:20px">${artHTML(w.de)}</div><div class="m">${esc(w.tr)}</div><div class="e">${esc(w.en)}</div></div>
  </div></div>
  <div class="row" id="fc-actions" style="justify-content:center">${fcButtons()}</div>`;
}
function fcButtons() { return fcState.flip ? `<button class="btn" data-fc="0">Bilmiyorum</button><button class="btn primary" data-fc="1">Biliyorum</button>` : `<button class="btn primary" data-flip-btn>Kartı çevir</button>`; }
function toggleFlip() { if (!fcState) return; fcState.flip = !fcState.flip; const c = $(".fcard"); if (c) c.classList.toggle("flip", fcState.flip); const a = $("#fc-actions"); if (a) a.innerHTML = fcButtons(); }
function rateCard(known) {
  const k = fcState.queue[fcState.i]; const r = S.vocab[k] || { box: 0, due: 0 };
  if (known) { r.box = Math.min(r.box + 1, VINTERVALS.length - 1); r.due = Date.now() + VINTERVALS[r.box]; fcState.known++; }
  else { r.box = 0; r.due = Date.now(); if (fcState.queue.length - fcState.i < 40) fcState.queue.push(k); }
  S.vocab[k] = r; const d = today(); S.days[d] = (S.days[d] || 0) + 1;
  fcState.i++; fcState.flip = false; save();
  if (fcState.i >= fcState.queue.length) { toast(`Deste bitti · ${fcState.known} kart bildin`); fcState = null; }
  render();
}

/* ---------- events ---------- */
function afterMain() {
  const dq = $("[data-dict]");
  if (dq) dq.addEventListener("input", e => { dictQ = e.target.value; $("#dict").innerHTML = dictRows(); });
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-flip]"); if (!t) return;
  const d = t.dataset;
  if (d.say != null) { speak(d.say, t.classList.contains("big") ? t : t); return; }
  if (d.go) { fcState = null; go(d.go); return; }
  if (d.lesson) {
    const s = S.session;
    if (s && s.id === d.lesson && s.phase !== "done") { fb = s.fb || null; ordPicked = []; go("play"); return; }
    startLesson(d.lesson); return;
  }
  if (d.quiz) { startQuiz(d.quiz); autoplayListen(); return; }
  if (d.resume != null) { fb = (S.session && S.session.fb) || null; ordPicked = []; go("play"); autoplayListen(); return; }
  if (d.drop != null) { S.session = null; save(); render(); return; }
  if (d.exit != null) { if ("speechSynthesis" in window) speechSynthesis.cancel(); if (S.session && S.session.phase === "done") S.session = null; save(); go(view); return; }
  if (d.home != null) { S.session = null; save(); go("home"); return; }
  if (d.start != null) { S.session.phase = "ex"; S.session.i = 0; save(); render(); window.scrollTo(0, 0); autoplayListen(); return; }
  if (d.opt != null) { submit(d.opt); return; }
  if (d.check != null) { const g = currentTyped(); if (!g.trim()) { toast("Önce bir cevap yaz."); return; } submit(g); return; }
  if (d.giveup != null || d.skipq != null) { submit(""); return; }
  if (d.next != null || d.skip != null) { advance(); return; }
  if (d.ch) { const inp = $("[data-ans]"); if (inp) { const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a; inp.value = inp.value.slice(0, a) + d.ch + inp.value.slice(b); inp.focus(); inp.setSelectionRange(a + 1, a + 1); } return; }
  if (d.pick != null) { const i = +d.pick; if (!ordPicked.includes(i)) ordPicked.push(i); render(); return; }
  if (d.unpick != null) { ordPicked.splice(+d.unpick, 1); render(); return; }
  if (d.reveal != null) { const tr = $("[data-transcript]"); if (tr) tr.hidden = false; t.remove(); return; }
  if (d.playall != null) { const box = t.closest("[data-dlg]"); const btns = $$(".say", box); let i = 0; const nxt = () => { if (i < btns.length) { const b = btns[i++]; speak(b.dataset.say, b, nxt); } }; nxt(); return; }
  if (d.retry != null) { const w = S.session.res.filter(r => !r.ok).map(r => r.k); startReview(w, "Yanlışları tekrar"); autoplayListen(); return; }
  if (d.reviewDue != null) { startReview(dueMistakes()); autoplayListen(); return; }
  if (d.reviewAll != null) { startReview(shuffle(Object.keys(S.mistakes), Date.now() % 9999), "Tüm yanlışlar · karışık"); autoplayListen(); return; }
  if (d.forget) { if (S.mistakes[d.forget]) { delete S.mistakes[d.forget]; S.stats.mastered++; save(); render(); toast("Listeden çıkarıldı"); } return; }
  if (d.rf) { revFilter = d.rf; render(); return; }
  if (d.fcDue != null) { startFlash(shuffle(dueWords().map(w => w.key), Date.now() % 9999).slice(0, 30)); return; }
  if (d.fcNew != null) { startFlash(ALL_WORDS.filter(w => !S.vocab[w.key]).slice(0, 10).map(w => w.key)); return; }
  if (d.deck) { const ws = ALL_WORDS.filter(w => w.lid === d.deck); const pri = ws.filter(w => !S.vocab[w.key] || S.vocab[w.key].due <= Date.now()); startFlash((pri.length ? pri : ws).map(w => w.key)); return; }
  if (d.flip != null || d.flipBtn != null) { toggleFlip(); return; }
  if (d.fc != null) { rateCard(d.fc === "1"); return; }
  if (d.fcEnd != null) { fcState = null; render(); return; }
  if (d.backup != null) {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const done = () => toast("Yedek kodu kopyalandı");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done).catch(() => { const b = $("#restore-box"); if (b) { b.value = code; b.select(); toast("Kod kutuya yazıldı, seçip kopyala"); } });
    else { const b = $("#restore-box"); if (b) { b.value = code; b.select(); toast("Kod kutuya yazıldı, seçip kopyala"); } }
    return;
  }
  if (d.restore != null) {
    const b = $("#restore-box"); const raw = b ? b.value.trim() : "";
    if (!raw) { toast("Önce yedek kodunu yapıştır."); return; }
    try {
      let obj; try { obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e2) { obj = JSON.parse(raw); }
      if (!obj || typeof obj !== "object" || !obj.lessons) throw new Error("bad");
      S = adopt(obj); S.updatedAt = Date.now(); fb = null; fcState = null; save(); render(); toast("İlerleme geri yüklendi");
    } catch (e) { toast("Bu kod okunamadı. Tamamını kopyaladığından emin ol."); }
    return;
  }
  if (d.reset != null) { confirmReset = true; render(); return; }
  if (d.resetNo != null) { confirmReset = false; render(); return; }
  if (d.resetYes != null) { const keep = S.settings; S = blank(); S.settings = keep; confirmReset = false; fcState = null; save(); render(); toast("İlerleme sıfırlandı"); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.setEn != null) { S.settings.en = t.checked; save(); }
  if (t.dataset.setRate != null) { S.settings.rate = parseFloat(t.value) || 0.9; save(); }
});
document.addEventListener("keydown", e => {
  if (mode === "play" && S.session && S.session.phase === "ex") {
    if (e.key === "Enter") {
      if (fb) { e.preventDefault(); advance(); return; }
      const inp = $("[data-ans]");
      if (inp && document.activeElement === inp && inp.value.trim()) { e.preventDefault(); submit(inp.value); return; }
      const ex = curEx(); if (ex && ex.type === "ord" && ordPicked.length) { e.preventDefault(); submit(currentTyped()); return; }
    }
    if (!fb && /^[1-4]$/.test(e.key) && document.activeElement && document.activeElement.tagName !== "INPUT") {
      const b = $$(".opt")[+e.key - 1]; if (b) { e.preventDefault(); b.click(); }
    }
  }
  if (view === "words" && fcState && mode === "main") {
    if ((e.key === " " || (e.key === "Enter" && document.activeElement && document.activeElement.hasAttribute("data-flip"))) && document.activeElement.tagName !== "INPUT") { e.preventDefault(); toggleFlip(); }
    else if (fcState.flip && (e.key === "1" || e.key === "ArrowLeft")) rateCard(false);
    else if (fcState.flip && (e.key === "2" || e.key === "ArrowRight")) rateCard(true);
  }
});

/* ---------- boot ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => fetch("sw.js", { method: "HEAD" }).then(r => { if (r.ok) navigator.serviceWorker.register("sw.js"); }).catch(() => {})); }
function start() {
  loadLocal();
  if (S.session && S.session.fb) fb = S.session.fb;
  render();
  initSync();
}
start();
})();

</script>
</body>
</html>
